<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活了么 - 下载页面</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /*
           1. 主题变量定义（支持原网页MD3风格与暗色模式）
            */
        :root {
            /* 亮色模式（默认） */
            --bg-color: #f8f9ff;
            --text-color: #1a1b20;
            --text-secondary: #44464f;
            --accent-color: #3f51b5;
            --card-bg: #fffbff;
            --border-color: #e1e2ec;
            --outline-color: #757780;
            --header-bg: rgba(248, 249, 255, 0.85);
            --hero-gradient: linear-gradient(180deg, #eef0ff 0%, var(--bg-color) 100%);
            --img-box-bg: #ffffff;
            --img-filter: brightness(100%);
            --clean-box-bg: #f0f1f9;
            --footer-bg: #e1e2ec;
            --footer-text: #1a1b20;
            --footer-tag-bg: rgba(255, 255, 255, 0.7);
        }

        html.dark {
            /* 暗色模式 */
            --bg-color: #121318;
            --text-color: #e3e2e6;
            --text-secondary: #c5c6d0;
            --accent-color: #b9c3ff;
            --card-bg: #1b1b1f;
            --border-color: #44464f;
            --outline-color: #8f909a;
            --header-bg: rgba(18, 19, 24, 0.85);
            --hero-gradient: linear-gradient(180deg, #1b1d2a 0%, var(--bg-color) 100%);
            --img-box-bg: #1b1b1f;
            --img-filter: brightness(85%) contrast(95%);
            --clean-box-bg: #23242a;
            --footer-bg: #1b1b1f;
            --footer-text: #e3e2e6;
            --footer-tag-bg: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        html {
            scroll-behavior: smooth;
        }

        /* 顶部导航 */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--accent-color);
        }
        
        /* 主题切换按钮样式 */
        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .theme-toggle-btn:hover {
            background: var(--clean-box-bg);
            transform: scale(1.05);
        }

        /* 导航按钮 */
        .nav-btn {
            background: var(--accent-color);
            color: var(--bg-color) !important;
            padding: 6px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .nav-btn:hover {
            opacity: 0.9;
            box-shadow: 0 2px 8px rgba(63,81,181,0.3);
        }

        /* 下载主区域 */
        .hero-section {
            padding: 120px 20px 60px 20px;
            text-align: center;
            background: var(--hero-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            transition: background 0.3s ease;
        }
        .hero-logo-wrapper {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 预留图片位：替换 test.png 即可更换应用图标 */
        .app-icon {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(63,81,181,0.25);
            filter: var(--img-filter);
            transition: filter 0.3s ease;
        }
        .hero-section h1 {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }
        .hero-section .version-tag {
            display: inline-block;
            background: var(--clean-box-bg);
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        .hero-section .hero-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 600px;
            margin-bottom: 40px;
            transition: color 0.3s ease;
        }

        /* 下载按钮组 */
        .download-section {
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
        }
        .download-group {
            margin-bottom: 30px;
        }
        .group-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: color 0.3s ease;
        }
        .recommended-badge {
            background: var(--accent-color);
            color: var(--bg-color);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        html.dark .recommended-badge {
            color: #1a1b20;
        }

        .btn-main {
            background: var(--accent-color);
            color: var(--bg-color);
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: background 0.2s, color 0.2s;
            box-shadow: 0 4px 12px rgba(63,81,181,0.2);
            display: block;
            margin-bottom: 12px;
            text-align: center;
        }
        html.dark .btn-main {
            color: #1a1b20;
        }
        .btn-main:hover {
            opacity: 0.9;
        }
        .btn-sub {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            display: block;
            margin-bottom: 12px;
            text-align: center;
        }
        .btn-sub:hover {
            background: rgba(63,81,181,0.05);
        }

        /* 返回首页按钮 */
        .back-button {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 24px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .back-button:hover {
            background: var(--clean-box-bg);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .info-text {
            text-align: center;
            color: var(--outline-color);
            font-size: 14px;
            margin-top: 30px;
            transition: color 0.3s ease;
        }

        /* 底部 */
        footer {
            background: var(--footer-bg);
            color: var(--footer-text);
            padding: 40px 20px;
            margin-top: 60px;
            text-align: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .footer-content {
            max-width: 800px;
            margin: 0 auto;
        }
        .footer-brand h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--accent-color);
            transition: color 0.3s ease;
        }
        .info-tag {
            display: inline-block;
            background: var(--footer-tag-bg);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin: 4px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        @media (max-width: 768px) {
            .hero-section {
                padding-top: 100px;
                min-height: auto;
            }
            .hero-section h1 {
                font-size: 28px;
            }
            .hero-section .hero-subtitle {
                font-size: 16px;
            }
            .btn-main, .btn-sub {
                padding: 12px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">活了么</a>
            <div class="nav-links">
                <a href="index.html#sponsor">支持赞助</a>
                <button class="theme-toggle-btn" id="themeToggle" title="切换主题">🌓</button>
                <a href="index.html" class="nav-btn">返回首页</a>
            </div>
        </div>
    </header>

    <div class="hero-section">
        <div class="hero-logo-wrapper">
            <!-- 预留图片位：将 test.png 替换为实际应用图标即可 -->
            <img src="test.png" alt="活了么" class="app-icon">
        </div>
        <h1>活了么</h1>
        <div class="version-tag">版本 1.3.6</div>
        <div class="hero-subtitle">选择适合您的下载方式</div>

        <div class="download-section">
            <div class="download-group">
                <div class="group-title">
                    下载方式
                    <span class="recommended-badge">推荐</span>
                </div>
                <a href="https://github.com/MWCanary/Huoleme/releases/download/V1.3.6/Huoleme_1.3.6.apk" class="btn-main">
                    GitHub 下载 (APK)
                </a>
            </div>

            <div class="download-group">
                <div class="group-title">备用下载</div>
                <a href="https://pan.sysri.cn/s/XA73HB" class="btn-sub">
                    Cloudreve 下载 1
                </a>
                <a href="https://pan.huang1111.cn/s/A6NvBiB" class="btn-sub">
                    Cloudreve 下载 2
                </a>
            </div>

            <a href="index.html" class="back-button">← 返回首页</a>
            
            <p class="info-text">请根据您的网络环境选择合适的下载方式</p>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <h3>活了么</h3>
                <div>
                    <span class="info-tag">当前版本：1.3.6</span>
                    <span class="info-tag">运行环境：Android 8.0+</span>
                </div>
            </div>
        </div>
        <p style="margin-top: 20px; font-size: 13px; color: var(--text-secondary);">© 2026 活了么</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 主题切换控制逻辑
            const themeToggleBtn = document.getElementById('themeToggle');
            const htmlElement = document.documentElement;

            // 初始化检测：优先查看缓存，没有则跟随系统
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                htmlElement.classList.add('dark');
                themeToggleBtn.textContent = '亮';
            } else {
                htmlElement.classList.remove('dark');
                themeToggleBtn.textContent = '暗';
            }

            // 手动点击按钮切换
            themeToggleBtn.addEventListener('click', () => {
                if (htmlElement.classList.contains('dark')) {
                    htmlElement.classList.remove('dark');
                    themeToggleBtn.textContent = '暗';
                    localStorage.setItem('theme', 'light');
                } else {
                    htmlElement.classList.add('dark');
                    themeToggleBtn.textContent = '亮';
                    localStorage.setItem('theme', 'dark');
                }
            });

            // 监听系统级主题切换
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    if (e.matches) {
                        htmlElement.classList.add('dark');
                        themeToggleBtn.textContent = '亮';
                    } else {
                        htmlElement.classList.remove('dark');
                        themeToggleBtn.textContent = '暗';
                    }
                }
            });
        });
    </script>
</body>
</html>
