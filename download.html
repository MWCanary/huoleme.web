           1. 主题变量定义（支持原网页MD3风格与暗色模式）

        :root {
            --bg-color: #f8f9ff;

            --text-secondary: #44464f;
            --accent-color: #3f51b5;

        html.dark {

            --accent-color: #b9c3ff;
            --card-bg: #1b1b1f;
            --border-color: #44464f;
            --outline-color: #8f909a;
            --header-bg: rgba(18, 19, 24, 0.85);
            --hero-gradient: linear-gradient(180deg, #1b1d2a 0%, var(--bg-color) 100%);
            --img-box-bg: #1b1b1f;
            --img-filter: brightness(85%) contrast(95%);
            --clean-box-bg: #23242a;
            --footer-bg: #1b1b1f;
            --footer-text: #e3e2e6;
            --footer-tag-bg: rgba(255, 255, 255, 0.08);

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;

            transition: background-color 0.3s ease, color 0.3s ease;

        html { scroll-behavior: smooth; }

        header {
            position: fixed; top: 0; width: 100%;
            background: var(--header-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .nav-container {
            max-width: 1200px; margin: 0 auto; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 20px; font-weight: 700; color: var(--accent-color); text-decoration: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: var(--accent-color); }
        
        .theme-toggle-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-color);
            width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.3s ease;
        }
        .theme-toggle-btn:hover { background: var(--clean-box-bg); transform: scale(1.05); }

        .nav-btn {
            background: var(--accent-color); color: var(--bg-color) !important;
            padding: 6px 16px; border-radius: 20px; text-decoration: none;
            font-size: 14px; font-weight: 500; transition: all 0.3s;
        }
        .nav-btn:hover { opacity: 0.9; box-shadow: 0 2px 8px rgba(63,81,181,0.3); }

        .hero-section {
            padding: 120px 20px 60px 20px; text-align: center;
            background: var(--hero-gradient);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 70vh; transition: background 0.3s ease;
        }
        .hero-logo-wrapper {
            width: 120px; height: 120px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .app-icon {
            width: 100px; height: 100px; object-fit: cover; border-radius: 22px;
            box-shadow: 0 10px 25px rgba(63,81,181,0.25);
            filter: var(--img-filter); transition: filter 0.3s ease;
        }
        .hero-section h1 { font-size: 36px; font-weight: 700; color: var(--accent-color); margin-bottom: 10px; }
        .hero-section .version-tag {
            display: inline-block; background: var(--clean-box-bg); color: var(--text-secondary);
            padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 500;
            margin-bottom: 30px; border: 1px solid var(--border-color);
        }
        .hero-section .hero-subtitle { font-size: 18px; color: var(--text-secondary); max-width: 600px; margin-bottom: 40px; }

        .download-section { max-width: 800px; width: 100%; padding: 0 20px; }
        .download-group { margin-bottom: 30px; }
        .group-title {
            font-size: 18px; font-weight: 600; color: var(--text-color); margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .recommended-badge {
            background: var(--accent-color); color: var(--bg-color);
            padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500;
        }
        html.dark .recommended-badge { color: #1a1b20; }

        .btn-main {
            background: var(--accent-color); color: var(--bg-color);
            padding: 14px 32px; border-radius: 8px; text-decoration: none;
            font-weight: 500; font-size: 16px; transition: background 0.2s, color 0.2s;
            box-shadow: 0 4px 12px rgba(63,81,181,0.2);
            display: block; margin-bottom: 12px; text-align: center;
        }
        html.dark .btn-main { color: #1a1b20; }
        .btn-main:hover { opacity: 0.9; }
        .btn-sub {
            background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color);
            padding: 14px 32px; border-radius: 8px; text-decoration: none;
            font-weight: 500; font-size: 16px; transition: background 0.2s, color 0.2s, border-color 0.2s;
            display: block; margin-bottom: 12px; text-align: center;
        }
        .btn-sub:hover { background: rgba(63,81,181,0.05); }

        .back-button {
            display: inline-block; margin-top: 40px; padding: 12px 24px;
            background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color);
            border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 14px; transition: all 0.3s ease;
        }
        .back-button:hover { background: var(--clean-box-bg); border-color: var(--accent-color); color: var(--accent-color); }

        .info-text { text-align: center; color: var(--outline-color); font-size: 14px; margin-top: 30px; }

        footer {
            background: var(--footer-bg); color: var(--footer-text);
            padding: 40px 20px; margin-top: 60px; text-align: center;
        }
        .footer-content { max-width: 800px; margin: 0 auto; }
        .footer-brand h3 { font-size: 20px; margin-bottom: 10px; color: var(--accent-color); }
        .info-tag {
            display: inline-block; background: var(--footer-tag-bg);
            padding: 4px 12px; border-radius: 8px; font-size: 13px; margin: 4px; font-weight: 500;
        }

        @media (max-width: 768px) {
            .hero-section { padding-top: 100px; min-height: auto; }
            .hero-section h1 { font-size: 28px; }
            .hero-section .hero-subtitle { font-size: 16px; }
            .btn-main, .btn-sub { padding: 12px 24px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="hero-logo-wrapper">
            <img src="https://s41.ax1x.com/2026/11/07/pnf0fiR.png" alt="测试" class="app-icon">

        </div>
        <h1>活了么</h1>
        <div class="version-tag">版本 1.3.6</div>
        <div class="hero-subtitle">选择适合您的下载方式</div>

        <div class="download-section">
            <!-- Android 下载组 -->
            <div id="android-downloads" class="download-group" style="display: none;">

    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <h3>活了么</h3>

                    <span class="info-tag">当前版本：1.3.6</span>

        <p style="margin-top: 20px; font-size: 13px; color: var(--text-secondary);">© 2026 活了么</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 主题切换逻辑
            const themeToggleBtn = document.getElementById('themeToggle');
            const htmlElement = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                htmlElement.classList.add('dark');
                themeToggleBtn.textContent = '亮';
            } else {
                htmlElement.classList.remove('dark');
                themeToggleBtn.textContent = '暗';
            }

            themeToggleBtn.addEventListener('click', () => {
                if (htmlElement.classList.contains('dark')) {
                    htmlElement.classList.remove('dark');
                    themeToggleBtn.textContent = '暗';
                    localStorage.setItem('theme', 'light');
                } else {
                    htmlElement.classList.add('dark');
                    themeToggleBtn.textContent = '亮';
                    localStorage.setItem('theme', 'dark');
                }
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    if (e.matches) {
                        htmlElement.classList.add('dark');
                        themeToggleBtn.textContent = '亮';
                    } else {
                        htmlElement.classList.remove('dark');
                        themeToggleBtn.textContent = '暗';
                    }
                }
            });

            // 2. UA 设备判断与切换逻辑
            const isMobile = /Mobi|Android|iPhone|iPad|iPod|Windows Phone|HarmonyOS/i.test(navigator.userAgent);
            const androidDiv = document.getElementById('android-downloads');
            const windowsDiv = document.getElementById('windows-downloads');
            const switchBtn = document.getElementById('switch-platform');

            function showAndroid() {
                androidDiv.style.display = 'block';
                windowsDiv.style.display = 'none';
                switchBtn.textContent = '👉 查看 Windows 版本';
                switchBtn.style.display = 'block';
            }

            function showWindows() {
                androidDiv.style.display = 'none';
                windowsDiv.style.display = 'block';
                switchBtn.textContent = '👉 查看 Android 版本';
                switchBtn.style.display = 'block';
            }

            if (isMobile) {
                showAndroid();
            } else {
                showWindows();
            }

            switchBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (androidDiv.style.display === 'block') {
                    showWindows();
                } else {
                    showAndroid();
                }
            });
        });
    </script>
